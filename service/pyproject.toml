[project]
name = "boor-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evan Appel", email = "28764149+EvanWAppel@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.122.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "testcontainers[postgres]>=4.15.0",
    "ty>=0.0.70",
]

[tool.ruff]
line-length = 100
# Alembic-autogenerated revisions have tool-controlled formatting; don't lint them.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
